# Build + test on every push/PR; on a `v*` tag, pack and publish both NuGet
# packages (Reckon.Client, Reckon.Extensions.Hosting) to nuget.org.
#
# Publishing needs the repo Actions secret NUGET_API_KEY (an api key from
# nuget.org scoped to push these two package ids).
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      # The SDK ships only the net10 runtime; build covers net8/9/10,
      # tests run on net10.0.
      - run: dotnet test -c Release -f net10.0 --no-build


  # The release guard. version-root names the directory whose manifest
  # carries the version this repository publishes; the default is the root.
  release-guard:
    name: The release guard
    uses: macula-io/macula-ci-images/.github/workflows/release-guard.yml@b4c41abb404c32215a2823b7f19ac65b732e1dfe
    with:
      version-root: src/Reckon.Client
  # Every C# block README.md publishes compiles against Reckon.Client, and a doc
  # change runs this (macula-codebase-checks#8). The pin is a full commit SHA. The
  # submodule is the wire contract: the package generates its stubs from the
  # .proto files under proto/, so without it nothing compiles and every block
  # fails for a reason the doc does not have.
  docs:
    name: docs (C# snippets)
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/doc-snippets-csharp.yml@d25a36c1b6ba7b8e72db17873aa7c2c7793eba70
    with:
      submodules: recursive
  publish:
    needs: [build-test, release-guard, docs]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet pack -c Release -o artifacts
      - name: push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          FEED: https://api.nuget.org/v3/index.json
        # Reckon.Client sorts before Reckon.Extensions.Hosting, so the dependency
        # publishes first. --skip-duplicate keeps re-runs idempotent.
        run: |
          dotnet nuget push "artifacts/*.nupkg"  --source "$FEED" --api-key "$NUGET_API_KEY" --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" --source "$FEED" --api-key "$NUGET_API_KEY" --skip-duplicate
