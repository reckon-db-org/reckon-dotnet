# Codeberg-native CI/CD via Forgejo Actions (self-hosted runner on msi00).
#
# Build + test on every push/PR; on a `v*` tag, pack and publish both NuGet
# packages to Codeberg's own package registry. No GitHub, no nuget.org.
#
# Note: we clone with plain `git` in a run step rather than actions/checkout.
# The job runs inside the .NET SDK container (which has git but not node), and
# a JS action like checkout needs node injected — fragile under the rootless
# podman runner. reckon-dotnet is public, so an unauthenticated clone is fine.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: checkout
        run: |
          git clone --recurse-submodules https://codeberg.org/reckon-db-org/reckon-dotnet .
          git checkout ${{ github.sha }}
          git submodule update --init --recursive
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      # The SDK image ships only the net10 runtime; build covers net8/9/10,
      # tests run on net10.0.
      - run: dotnet test -c Release -f net10.0 --no-build

  publish:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: checkout
        run: |
          git clone --recurse-submodules https://codeberg.org/reckon-db-org/reckon-dotnet .
          git checkout ${{ github.sha }}
          git submodule update --init --recursive
      - run: dotnet pack -c Release -o artifacts
      - name: push to Codeberg NuGet feed
        env:
          NUGET_TOKEN: ${{ secrets.CODEBERG_NUGET_TOKEN }}
          FEED: https://codeberg.org/api/packages/reckon-db-org/nuget/index.json
        # Reckon.Client sorts before Reckon.Extensions.Hosting, so the dependency
        # publishes first. --skip-duplicate keeps re-runs idempotent.
        run: |
          dotnet nuget push "artifacts/*.nupkg"  --source "$FEED" --api-key "$NUGET_TOKEN" --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" --source "$FEED" --api-key "$NUGET_TOKEN" --skip-duplicate
